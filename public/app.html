<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkyScope · Live Map</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body class="app-body">

  
  <nav class="app-navbar">
    <div class="app-logo">
      <span>✈️</span>
      SkyScope
    </div>

    <div class="navbar-country">
      <select id="countrySelect">
        <option value="">Loading countries...</option>
      </select>
    </div>

    <div class="navbar-search">
      <input type="text" id="searchInput" placeholder="Search airports..." autocomplete="off" />
      <div class="search-results" id="searchResults"></div>
    </div>

    <div class="navbar-actions">
      <button class="nav-btn" id="locateBtn" title="Use my location">📍</button>
      <button class="nav-btn" id="infoBtn" title="Country info">ℹ️</button>
      <button class="nav-btn" id="logoutBtn" title="Logout">🚪</button>
    </div>
  </nav>

  
  <div class="app-main">
    <div id="map"></div>

    
    <div class="map-loading" id="mapLoading">
      <div class="spinner"></div>
      <p>Loading map...</p>
    </div>

    
    <div class="plane-badge">
      <span class="dot"></span>
      <span>✈️ <b id="planeCount">0</b> planes</span>
    </div>

    
    <aside class="info-panel" id="infoPanel">
      <div class="info-panel-header">
        <button class="info-panel-close" id="closeInfo">✕</button>
        <span class="info-flag" id="infoFlag">🏳️</span>
        <div class="info-country-name" id="infoName">Country</div>
        <div class="info-country-official" id="infoOfficial">Official Name</div>
      </div>

      <div class="info-body">
        <div class="info-section">
          <h4>Quick Facts</h4>
          <div class="info-grid" id="infoStats">
            <div class="info-stat">
              <div class="label">Capital</div>
              <div class="value" id="infoCapital">—</div>
            </div>
            <div class="info-stat">
              <div class="label">Population</div>
              <div class="value" id="infoPopulation">—</div>
            </div>
            <div class="info-stat">
              <div class="label">Region</div>
              <div class="value" id="infoRegion">—</div>
            </div>
            <div class="info-stat">
              <div class="label">Area</div>
              <div class="value" id="infoArea">—</div>
            </div>
          </div>
        </div>

        <div class="info-section">
          <h4>Airports</h4>
          <div class="info-grid" id="infoAirports">
            <div class="info-stat">
              <div class="label">Total</div>
              <div class="value" id="infoAirTotal">—</div>
            </div>
            <div class="info-stat">
              <div class="label">Scheduled</div>
              <div class="value" id="infoAirScheduled">—</div>
            </div>
          </div>
        </div>

        <div class="info-section">
          <h4>Details</h4>
          <div class="info-row">
            <span class="key">Languages</span>
            <span class="val" id="infoLanguages">—</span>
          </div>
          <div class="info-row">
            <span class="key">Currency</span>
            <span class="val" id="infoCurrency">—</span>
          </div>
          <div class="info-row">
            <span class="key">Timezones</span>
            <span class="val" id="infoTimezones">—</span>
          </div>
        </div>

        <div class="info-section">
          <h4>📰 Aviation News</h4>
          <ul class="news-list" id="newsList">
            <li class="news-item" style="color: var(--muted); font-size: 13px;">Loading news...</li>
          </ul>
        </div>
      </div>
    </aside>
  </div>

  
  <div class="status-bar">
    <div class="status-stats">
      <span class="status-stat">✈️ <b id="statusPlanes">0</b> planes</span>
      <span class="status-stat">🏢 <b id="statusAirports">0</b> airports</span>
      <span class="status-stat">📍 <b id="statusCountry">—</b></span>
    </div>
    <span class="status-updated" id="statusUpdated">—</span>
  </div>

  
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/map.js"></script>
  <script src="js/country.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
